name: Playwright E2E

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional commit SHA that a manual run must verify"
        required: false
        type: string

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (Windows)
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert dispatched commit SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 42+ downloads its binary on first run, not at install.
      # Fetch it once here so parallel Playwright workers don't race on it.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Run Playwright E2E
        run: pnpm test:e2e
        env:
          ELECTRON_RUN_AS_NODE: ""

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: ignore
