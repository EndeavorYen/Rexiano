name: GitHub Release

# A new version at the top of src/data/changelog.json (with package.json
# bumped to match) becomes a tag and a GitHub Release once it lands on main.
# Merges without a new version do nothing; an existing release is never
# touched again.
on:
  push:
    branches: [main]
    paths:
      - "src/data/changelog.json"
      - "package.json"
      - "scripts/release-notes.mjs"
      - ".github/workflows/github-release.yml"
  workflow_dispatch:

concurrency:
  group: github-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the newest version
        id: notes
        run: node scripts/release-notes.mjs release-notes.md >> "$GITHUB_OUTPUT"

      - name: Publish when the release is new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.notes.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released."
            exit 0
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --latest
