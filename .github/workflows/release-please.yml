name: Release Please

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Dispatch checks for release pull request
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail

          if ! jq -er 'length == 1 and .[0].baseBranchName == "main" and (.[] | .headBranchName | length > 0)' <<< "$RELEASE_PRS" >/dev/null; then
            echo "Expected exactly one release pull request for main." >&2
            exit 1
          fi

          release_branch="$(jq -er '.[0].headBranchName' <<< "$RELEASE_PRS")"
          release_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$release_branch" --jq .object.sha)"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release pull request did not resolve to an immutable commit." >&2
            exit 1
          fi

          gh workflow run .github/workflows/ci.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch" --field expected_sha="$release_sha"
          gh workflow run .github/workflows/playwright.yml --repo "$GITHUB_REPOSITORY" --ref "$release_branch" --field expected_sha="$release_sha"

      - name: Dispatch release artifact workflow
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: >-
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
          --field tag="$RELEASE_TAG" --field expected_sha="$RELEASE_SHA"
