appId: com.rexiano.app
productName: Rexiano
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
extraResources:
  - from: CHANGELOG.md
    to: CHANGELOG.md

# --- File associations: open scores and MIDI with Rexiano ---
fileAssociations:
  - ext: mid
    name: MIDI File
    description: Standard MIDI file
    mimeType: audio/midi
    role: Viewer
  - ext: midi
    name: MIDI File
    description: Standard MIDI file
    mimeType: audio/midi
    role: Viewer
  - ext: musicxml
    name: MusicXML Score
    description: MusicXML score
    mimeType: application/vnd.recordare.musicxml+xml
    role: Viewer

# --- Windows ---
win:
  executableName: Rexiano
  icon: build/icon.ico
  artifactName: ${name}-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  license: LICENSE
portable:
  artifactName: ${name}-${version}-portable.${ext}
  requestExecutionLevel: user

# --- macOS ---
mac:
  icon: build/icon.icns
  category: public.app-category.education
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # Default local builds stay unsigned/not-notarized. Official GitHub releases
  # fail closed: missing signing or notarization credentials fail the workflow.
  # The release workflow overrides this with -c.mac.notarize=true; there is no
  # unsigned production fallback.
  notarize: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
  background: build/dmg-background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# --- Linux ---
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  maintainer: rexiano.dev
  category: Education
  mimeTypes:
    - audio/midi
    - audio/x-midi
    - application/vnd.recordare.musicxml+xml
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}

npmRebuild: false
